services:
  - type: web
    name: notice-radar
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt gunicorn
    startCommand: gunicorn -b 0.0.0.0:$PORT -w 2 --timeout 60 app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      # 可选：填了才启用大模型通道，不填自动走规则解析，页面照常出结果
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
